<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>WDB Club — мини-приложение (прототип)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
  /* Оболочка прототипа: рамка телефона на десктопе. В дизайн-систему не входит. */
  html, body { background: #111; }
  #app { position: relative; max-width: 440px; height: 100dvh; margin: 0 auto; background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 520px) {
    body { padding: 24px 0; }
    #app { height: min(880px, calc(100dvh - 48px)); border-radius: 36px; border: 6px solid #2F2E2E; }
  }
  .proto { font-size: 11px; color: #666; text-align: center; margin-top: 20px; }

  /* Экраны, которые уходят в первом этапе (#2): партнёры-список, галерея,
     карта участника, настройки уведомлений. В дизайн-систему не входят. */
  .sub { color: var(--quiet); font-size: 13px; margin: 0 0 14px; }
  .search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 42px; margin-bottom: 12px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; height: 100%; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px; scrollbar-width: none; }
  .chip { flex: none; height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line); font-size: 14px; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 600; }
  .badge { flex: none; padding: 5px 10px; border-radius: 14px; border: 1.5px solid var(--acc); background: rgba(255,218,31,.12); font-weight: 700; font-size: 13px; }
  .btn.ghost { background: none; color: var(--acc); border: 1.5px solid var(--acc); }
  .albums { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .album { text-align: left; }
  .album .ph { aspect-ratio: 1 / .85; border-radius: var(--r); margin-bottom: 8px; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photos button { aspect-ratio: 1; border-radius: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .two .btn { height: 42px; font-size: 15px; margin: 0; }
  .mcard { width: 100%; text-align: left; background: var(--acc); color: var(--on-acc); border-radius: 18px; padding: 16px 18px; display: flex; justify-content: space-between; min-height: 160px; }
  .mcard .l { display: flex; flex-direction: column; justify-content: space-between; }
  .mcard b.brand { font-size: 18px; letter-spacing: .5px; }
  .mcard .no { font-size: 22px; font-weight: 800; }
  .qr { background: #fff; padding: 8px; border-radius: 10px; flex: none; }
  .qr svg { display: block; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; width: 100%; text-align: left; }
  .sw { width: 46px; height: 28px; border-radius: 14px; background: #4a4949; position: relative; transition: .2s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; }
  .on > .sw { background: var(--acc); } .on > .sw::after { left: 21px; background: #000; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; z-index: 10; animation: fade .15s; }
  .sheet { width: 100%; background: #141414; border-radius: 22px 22px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .2s; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #444; margin: 0 auto 16px; }
  .viewer { position: absolute; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; animation: fade .15s; }
  .viewer .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
  .viewer .img { flex: 1; margin: 0 0 40px; }
  @keyframes up { from { transform: translateY(40px) } }
</style>
</head>
<body>
<div id="app">
  <header><button class="l" id="hl"></button><div class="t"><b>WDB Club</b><small>мини-приложение</small></div><button class="r" id="hr"></button></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (tg) {
  document.body.classList.add('tg');
  tg.ready(); tg.expand();
  try { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor && tg.setBottomBarColor(bg); } catch (e) {}
}
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

// ---------- данные-заглушки ----------
const CATS = ['Все', 'Сервис', 'Детейлинг', 'Тюнинг', 'Отдых'];
const PARTNERS = [
  { id: 'star', logo: 'ДС', name: 'Детейлинг «Стар»', cat: 'Детейлинг', meta: 'Детейлинг и оклейка', off: '−15%', offer: 'Скидка 15% на оклейку плёнкой', until: 'до 31 декабря 2026', since: 2025, addr: 'ул. Примерная, 12', tel: '+7 900 000-00-01', site: 'star-detailing.ru' },
  { id: 'motor', logo: 'ТМ', name: 'Техцентр «Мотор»', cat: 'Сервис', meta: 'Сервис Mercedes-Benz', off: '−10%', offer: 'Скидка 10% на ТО и диагностику', until: 'бессрочно', since: 2024, addr: 'Волоколамское ш., 90', tel: '+7 900 000-00-02', site: 'motor-service.ru' },
  { id: 'os', logo: 'ШО', name: 'Шинный центр «Ось»', cat: 'Сервис', meta: 'Шины и хранение', off: '−20%', offer: 'Сезонное хранение шин −20%', until: 'до 1 марта 2027', since: 2025, addr: 'ул. Шинная, 3', tel: '+7 900 000-00-03', site: 'os-tires.ru' },
  { id: 'brabus', logo: 'ПТ', name: 'Ателье «Пит-стоп»', cat: 'Тюнинг', meta: 'Чип-тюнинг и выхлоп', off: '−12%', offer: 'Чип-тюнинг Stage 1 со скидкой 12%', until: 'до 31 декабря 2026', since: 2026, addr: 'ул. Гоночная, 7', tel: '+7 900 000-00-04', site: 'pitstop-tune.ru' },
  { id: 'wrap', logo: 'ПК', name: 'Студия «Плёнка»', cat: 'Детейлинг', meta: 'Полировка и керамика', off: '−10%', offer: 'Керамика кузова −10%', until: 'бессрочно', since: 2025, addr: 'ул. Лаковая, 21', tel: '+7 900 000-00-05', site: 'plenka.studio' },
  { id: 'loza', logo: 'ВЛ', name: 'Винотека «Лоза»', cat: 'Отдых', meta: 'Вино и бар', off: '−12%', offer: 'Скидка 12% на счёт и закрытые дегустации', until: 'бессрочно', since: 2024, addr: 'Пресненская наб., 8', tel: '+7 900 000-00-06', site: 'loza-wine.ru' },
];
const EVENTS = [
  { id: 'night', d: '2026-11-14', time: '22:00', type: 'Заезд', name: 'Ночной заезд по Москве', place: 'КВЦ «Башня», Волоколамское ш., 71Ас1', short: 'старт у КВЦ «Башня»', desc: ['Сбор в 21:30, инструктаж и выдача раций.', 'Маршрут: Садовое кольцо, набережные, Воробьёвы горы. Финиш — кофе у партнёра.'], going: 24, cap: 40 },
  { id: 'dinner', d: '2026-11-21', time: '19:00', type: 'Встреча', name: 'Клубный ужин', place: 'Винотека «Лоза», Пресненская наб., 8', short: 'ресторан партнёра', desc: ['Ужин участников клуба, знакомство с новыми членами.', 'Дресс-код smart casual.'], going: 40, cap: 40 },
  { id: 'detail', d: '2026-11-27', time: '18:00', type: 'Мастер-класс', name: 'Уход за кузовом зимой', place: 'Детейлинг «Стар», ул. Примерная, 12', short: 'у партнёра «Стар»', desc: ['Как защитить ЛКП от реагентов, что делать с керамикой зимой.', 'Мастера ответят на вопросы по вашим машинам.'], going: 9, cap: 15 },
  { id: 'ny', d: '2026-12-19', time: '20:00', type: 'Встреча', name: 'Новогодняя вечеринка клуба', place: 'Место уточняется', short: 'место уточняется', desc: ['Итоги года, награждение активных участников.'], going: 57, cap: 120 },
  { id: 'ice', d: '2027-01-24', time: '11:00', type: 'Трек', name: 'Зимний трек-день на льду', place: 'Ледовый автодром, Подмосковье', short: 'ледовый автодром', desc: ['Инструкторы, разные упражнения на контроль заноса.', 'Для полноприводных и заднеприводных машин.'], going: 12, cap: 30 },
];
const ALBUMS = [
  { id: 'autumn', name: 'Осенний заезд', d: '26 октября 2026', short: '26 окт', year: 2026, n: 86 },
  { id: 'dinner-oct', name: 'Клубный ужин', d: '12 октября 2026', short: '12 окт', year: 2026, n: 54 },
  { id: 'track', name: 'Трек-день AMG', d: '20 сентября 2026', short: '20 сен', year: 2026, n: 120 },
  { id: 'open', name: 'Открытие сезона', d: '18 апреля 2026', short: '18 апр', year: 2026, n: 73 },
  { id: 'ny25', name: 'Новогодняя вечеринка', d: '20 декабря 2025', short: '20 дек', year: 2025, n: 64 },
  { id: 'aut25', name: 'Закрытие сезона', d: '11 октября 2025', short: '11 окт', year: 2025, n: 41 },
];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// ---------- состояние ----------
const saved = JSON.parse(localStorage.getItem('wdb-proto') || '{}');
const S = Object.assign({
  signed: { night: true }, waitlist: { dinner: true },
  profile: { name: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : 'Иван Петров',
             car: 'Mercedes-AMG G 63, 2023', tg: tgUser && tgUser.username ? '@' + tgUser.username : '@ivan_petrov', about: 'Предприниматель, люблю трек-дни' },
  sw: { remind: true, visible: true, promo: false },
}, saved);
S.ui = { cat: 'Все', q: '', month: null, sel: null, year: 'Все' };
const persist = () => localStorage.setItem('wdb-proto', JSON.stringify({ signed: S.signed, waitlist: S.waitlist, profile: S.profile, sw: S.sw }));

// ---------- навигация ----------
const TABS = [
  ['partners', 'Партнёры', '<circle cx="8.5" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15.5" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/>'],
  ['calendar', 'Календарь', '<rect x="3.5" y="4.5" width="17" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4" stroke="currentColor" stroke-width="1.8"/>'],
  ['gallery', 'Галерея', '<rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 17l4-5 3 3 3-4 3 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'],
  ['profile', 'Профиль', '<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20.5c1.5-4 4.5-6 7.5-6s6 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.8"/>'],
];
let stack = [['partners']];
const cur = () => stack[stack.length - 1];
function go(...route) { stack.push(route); render(true); haptic(); }
function back() { if (stack.length > 1) { stack.pop(); render(true); } }
function tab(t) { stack = [[t]]; render(true); haptic(); }
function haptic() { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }
if (tg) tg.BackButton.onClick(back);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const parse = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd); };
const ev = id => EVENTS.find(e => e.id === id);
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; $('#app').appendChild(el); setTimeout(() => el.remove(), 1800); }

function render(scrollTop) {
  const [view, arg] = cur();
  const root = stack[0][0];
  $('#nav').innerHTML = TABS.map(([k, label, icon]) => `<button class="${k === root ? 'on' : ''}" onclick="tab('${k}')"><svg viewBox="0 0 24 24">${icon}</svg>${label}</button>`).join('');
  $('#hl').textContent = stack.length > 1 ? '‹ Назад' : 'Закрыть';
  $('#hl').onclick = stack.length > 1 ? back : () => toast('В Telegram здесь закроется мини-апп');
  $('#hr').textContent = view === 'profile' ? 'Изменить' : '';
  $('#hr').onclick = view === 'profile' ? () => go('settings') : null;
  if (tg) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  $('#main').innerHTML = VIEWS[view](arg);
  if (scrollTop) $('#main').scrollTop = 0;
}

// ---------- экраны ----------
const VIEWS = {
  partners() {
    const q = S.ui.q.toLowerCase();
    const list = PARTNERS.filter(p => (S.ui.cat === 'Все' || p.cat === S.ui.cat) && (!q || (p.name + p.meta).toLowerCase().includes(q)));
    return `<h1>Партнёры клуба</h1><p class="sub">Скидки и спецпредложения для участников</p>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#B3B3B3" stroke-width="2"/><path d="M15.5 15.5l5 5" stroke="#B3B3B3" stroke-width="2"/></svg>
        <input id="q" placeholder="Поиск партнёров" value="${esc(S.ui.q)}" oninput="S.ui.q=this.value; renderList()"></label>
      <div class="chips">${CATS.map(c => `<button class="chip ${c === S.ui.cat ? 'on' : ''}" onclick="S.ui.cat='${c}'; render()">${c}</button>`).join('')}</div>
      <div id="plist">${partnerList(list)}</div>`;
  },
  partner(id) {
    const p = PARTNERS.find(x => x.id === id);
    return `<div class="cover ph"></div>
      <div class="row"><div class="logo">${p.logo}</div><div><div style="font-size:18px;font-weight:700">${p.name}</div><div class="muted" style="font-size:13px">${p.meta} · партнёр клуба с ${p.since}</div></div></div>
      <div class="offer"><b>${p.offer}</b>Для участников клуба по карте из профиля<div class="muted" style="font-size:13px;margin-top:4px">Действует ${p.until}</div></div>
      <button class="btn" onclick="showCard()">Показать карту участника</button>
      <div style="margin-top:14px">
        <div class="kv"><span class="muted">Адрес</span><a href="#" onclick="toast('Откроются Яндекс Карты');return false">${p.addr}</a></div>
        <div class="kv"><span class="muted">Телефон</span><a href="#" onclick="toast('Позвонить ${p.tel}');return false">${p.tel}</a></div>
        <div class="kv"><span class="muted">Сайт</span><a href="#" onclick="toast('Откроется ${p.site}');return false">${p.site}</a></div>
      </div>`;
  },
  calendar() {
    if (!S.ui.month) S.ui.month = [TODAY.getFullYear(), TODAY.getMonth()];
    const [y, m] = S.ui.month;
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const evDays = new Set(EVENTS.map(e => parse(e.d)).filter(d => d.getFullYear() === y && d.getMonth() === m).map(d => d.getDate()));
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, m, d);
      const cls = [dt.getTime() === TODAY.getTime() ? 'today' : '', evDays.has(d) ? 'ev' : '', S.ui.sel === `${y}-${m}-${d}` ? 'sel' : ''].join(' ');
      cells += `<button class="day ${cls}" onclick="pickDay(${y},${m},${d})"><span>${d}</span></button>`;
    }
    let list, title;
    if (S.ui.sel) {
      const [sy, sm, sd] = S.ui.sel.split('-').map(Number);
      list = EVENTS.filter(e => { const d = parse(e.d); return d.getFullYear() === sy && d.getMonth() === sm && d.getDate() === sd; });
      title = `${sd} ${MON_GEN[sm]}`;
    } else {
      list = EVENTS.filter(e => parse(e.d) >= TODAY).slice(0, 4);
      title = 'Ближайшие';
    }
    return `<h1>Мероприятия</h1>
      <div class="month"><button onclick="shiftMonth(-1)">‹</button><b>${MONTHS[m]} ${y}</b><button onclick="shiftMonth(1)">›</button></div>
      <div class="grid7">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>
      <h2>${title}${S.ui.sel ? ` <button class="acc" style="font-size:13px;font-weight:400;float:right" onclick="S.ui.sel=null;render()">все события</button>` : ''}</h2>
      ${list.length ? list.map(eventRow).join('') : '<div class="empty">В этот день событий нет</div>'}`;
  },
  event(id) {
    const e = ev(id), d = parse(e.d);
    const signed = S.signed[id], wait = S.waitlist[id];
    const going = e.going + (signed ? 1 : 0), full = going >= e.cap && !signed;
    let btn;
    if (signed) btn = `<button class="btn done" onclick="toggleSign('${id}')">Вы записаны ✓ — отменить</button>`;
    else if (wait) btn = `<button class="btn done" onclick="toggleSign('${id}')">Вы в листе ожидания — выйти</button>`;
    else btn = `<button class="btn" onclick="toggleSign('${id}')">${full ? 'Встать в лист ожидания' : 'Записаться'}</button>`;
    return `<div class="cover ph"></div>
      <span class="tag">${e.type}</span>
      <div style="font-size:22px;font-weight:700;margin-bottom:10px">${e.name}</div>
      <div class="row" style="margin-bottom:6px">📅 <span>${WD[d.getDay()]}, ${d.getDate()} ${MON_GEN[d.getMonth()]}, ${e.time}</span></div>
      <div class="row" style="margin-bottom:12px">📍 <span>${e.place}</span></div>
      ${e.desc.map(t => `<p class="muted" style="margin:0 0 6px;font-size:14px">${t}</p>`).join('')}
      <div class="row" style="margin:16px 0">
        <div class="ava"><i>АК</i><i>МС</i><i>ДВ</i><i>+${Math.max(going - 3, 0)}</i></div>
        <div><b>Идут ${going} из ${e.cap}</b><div class="muted" style="font-size:13px">${going >= e.cap ? 'мест нет, работает лист ожидания' : 'места ещё есть'}</div></div>
      </div>
      ${btn}
      <button class="link" onclick="toast('Событие добавлено в календарь телефона')">Добавить в календарь</button>`;
  },
  gallery() {
    const years = ['Все', ...new Set(ALBUMS.map(a => a.year))];
    const list = ALBUMS.filter(a => S.ui.year === 'Все' || a.year == S.ui.year);
    return `<h1>Галерея</h1><p class="sub">Фото с мероприятий клуба</p>
      <div class="chips">${years.map(y => `<button class="chip ${y == S.ui.year ? 'on' : ''}" onclick="S.ui.year='${y}'; render()">${y}</button>`).join('')}</div>
      <div class="albums">${list.map(a => `<button class="album" onclick="go('album','${a.id}')"><div class="ph" style="${tone(a.id)}"></div><b>${a.name}</b><div class="muted" style="font-size:13px">${a.short} · ${a.n} фото</div></button>`).join('')}</div>`;
  },
  album(id) {
    const a = ALBUMS.find(x => x.id === id);
    const shown = Math.min(a.n, S.ui.shown || 18);
    return `<h1>${a.name}</h1><p class="sub" style="margin:0">${a.d} · ${a.n} фото</p>
      <div class="two"><button class="btn ghost" onclick="toast('Архив ${a.n} фото скачивается')">Скачать всё</button><button class="btn ghost" onclick="share('${a.name}')">Поделиться</button></div>
      <div class="photos">${Array.from({ length: shown }, (_, i) => `<button class="ph" style="${tone(id + i)}" onclick="viewPhoto('${id}',${i})"></button>`).join('')}</div>
      ${shown < a.n ? `<button class="link" onclick="S.ui.shown=${shown + 18}; render()">Показать ещё ${a.n - shown} фото</button>` : ''}`;
  },
  profile() {
    const p = S.profile;
    const initials = p.name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
    const photo = tgUser && tgUser.photo_url ? `<img src="${tgUser.photo_url}">` : initials;
    const mine = EVENTS.filter(e => S.signed[e.id] || S.waitlist[e.id]);
    return `<div class="me"><div class="av">${photo}</div><h1>${esc(p.name)}</h1><div class="muted" style="font-size:13px">${esc(p.car.split(',')[0])} · в клубе с 2024</div></div>
      <button class="mcard" onclick="showCard()"><div class="l"><div><b class="brand">WDB CLUB</b><div style="font-size:13px">Карта участника</div></div><div><div class="no">№ 0389</div><div style="font-size:13px">Нажмите, чтобы показать партнёру</div></div></div><div class="qr">${qr(96)}</div></button>
      <h2>Мои записи</h2>
      ${mine.length ? mine.map(e => { const d = parse(e.d); return `<button class="card" onclick="go('event','${e.id}')"><div class="main"><div class="name">${d.getDate()} ${MON_SHORT[d.getMonth()]} · ${e.name}</div><div class="${S.signed[e.id] ? 'status-ok' : 'meta'}">${S.signed[e.id] ? 'Вы записаны' : 'Лист ожидания'}</div></div><span class="muted">›</span></button>`; }).join('') : '<div class="empty">Вы пока никуда не записаны</div>'}
      <div class="proto">Прототип · данные вымышленные</div>`;
  },
  settings() {
    const p = S.profile;
    const sw = (k, t) => `<button class="toggle ${S.sw[k] ? 'on' : ''}" onclick="S.sw.${k}=!S.sw.${k}; persist(); render()"><span>${t}</span><span class="sw"></span></button>`;
    return `<h1 style="margin-bottom:16px">Настройки профиля</h1>
      <div class="field"><label>Имя и фамилия</label><input id="f-name" value="${esc(p.name)}"></div>
      <div class="field"><label>Автомобиль</label><input id="f-car" value="${esc(p.car)}"></div>
      <div class="field"><label>Telegram</label><input id="f-tg" value="${esc(p.tg)}"></div>
      <div class="field"><label>О себе</label><textarea id="f-about" rows="2">${esc(p.about)}</textarea></div>
      ${sw('remind', 'Напоминания о событиях')}${sw('visible', 'Показывать профиль в клубе')}${sw('promo', 'Новые партнёры и акции')}
      <button class="btn" style="margin-top:14px" onclick="saveProfile()">Сохранить</button>`;
  },
};

// ---------- помощники ----------
function partnerList(list) {
  return list.length ? list.map(p => `<button class="card" onclick="go('partner','${p.id}')"><div class="logo">${p.logo}</div><div class="main"><div class="name">${p.name}</div><div class="meta">${p.meta}</div></div><span class="badge">${p.off}</span></button>`).join('')
    : '<div class="empty">Ничего не нашлось</div>';
}
function renderList() {
  const q = S.ui.q.toLowerCase();
  $('#plist').innerHTML = partnerList(PARTNERS.filter(p => (S.ui.cat === 'Все' || p.cat === S.ui.cat) && (!q || (p.name + p.meta).toLowerCase().includes(q))));
}
function eventRow(e) {
  const d = parse(e.d);
  const st = S.signed[e.id] ? '<span class="status-ok">✓</span>' : '<span class="muted">›</span>';
  return `<button class="card" onclick="go('event','${e.id}')"><div class="date"><b>${d.getDate()}</b><small>${MON_SHORT[d.getMonth()]}</small></div><div class="main"><div class="name">${e.name}</div><div class="meta">${WD[d.getDay()]}, ${e.time} · ${e.short}</div></div>${st}</button>`;
}
function shiftMonth(k) { let [y, m] = S.ui.month; m += k; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.ui.month = [y, m]; S.ui.sel = null; render(); }
function pickDay(y, m, d) { const k = `${y}-${m}-${d}`; S.ui.sel = S.ui.sel === k ? null : k; render(); haptic(); }
function toggleSign(id) {
  const e = ev(id);
  if (S.signed[id]) { delete S.signed[id]; toast('Запись отменена'); }
  else if (S.waitlist[id]) { delete S.waitlist[id]; toast('Вы вышли из листа ожидания'); }
  else if (e.going >= e.cap) { S.waitlist[id] = true; toast('Вы в листе ожидания'); }
  else { S.signed[id] = true; toast('Вы записаны! Напомним за день'); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); }
  persist(); render();
}
function saveProfile() {
  S.profile = { name: $('#f-name').value.trim() || S.profile.name, car: $('#f-car').value.trim(), tg: $('#f-tg').value.trim(), about: $('#f-about').value.trim() };
  persist(); toast('Профиль сохранён'); back();
}
function share(name) {
  const url = location.href.split('#')[0];
  if (tg) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Альбом «' + name + '» — WDB Club')}`);
  else if (navigator.share) navigator.share({ title: name, url }).catch(() => {});
  else toast('Ссылка на альбом скопирована');
}
function tone(seed) {
  let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = 20 + h % 24, b = 10 + (h >> 5) % 14, warm = h % 5 === 0;
  return `background:linear-gradient(${h % 360}deg, rgb(${a + (warm ? 30 : 0)},${a + (warm ? 24 : 0)},${a}), rgb(${b},${b},${b}))`;
}
function qr(size) {
  const n = 21, c = size / n; let s = '';
  const fin = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  let h = 389;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (fin(x, y)) continue;
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    if (h % 2) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}"/>`;
  }
  const f = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#000" shape-rendering="crispEdges">${s}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</svg>`;
}
function showCard() {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>
    <div style="text-align:center"><b style="font-size:18px">${esc(S.profile.name)}</b><div class="muted" style="font-size:13px;margin-bottom:16px">Участник WDB Club · № 0389 · действует до 31.12.2026</div>
    <div class="qr" style="display:inline-block;padding:14px">${qr(220)}</div>
    <p class="muted" style="font-size:13px">Покажите QR сотруднику партнёра</p></div>
    <button class="btn" onclick="this.closest('.overlay').remove()">Готово</button></div>`;
  o.onclick = () => o.remove();
  $('#app').appendChild(o);
  tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium');
}
function viewPhoto(id, i) {
  const a = ALBUMS.find(x => x.id === id);
  const o = document.createElement('div'); o.className = 'viewer';
  const draw = () => { o.innerHTML = `<div class="bar"><button onclick="this.closest('.viewer').remove()" style="font-size:26px">✕</button><span>${i + 1} из ${a.n}</span><button class="acc" onclick="toast('Фото сохранено')">Скачать</button></div>
    <div class="img ph" style="${tone(id + i)}"></div>`; };
  draw();
  let x0 = null;
  o.addEventListener('touchstart', e => x0 = e.touches[0].clientX);
  o.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { i = Math.min(a.n - 1, Math.max(0, i + (dx < 0 ? 1 : -1))); draw(); } x0 = null; });
  o.addEventListener('click', e => { if (e.target.classList.contains('img')) { const r = e.target.getBoundingClientRect(); i = Math.min(a.n - 1, Math.max(0, i + (e.clientX > r.left + r.width / 2 ? 1 : -1))); draw(); } });
  $('#app').appendChild(o);
}
const _go = go; go = (...r) => { if (r[0] === 'album') S.ui.shown = 18; _go(...r); };

render();
</script>
