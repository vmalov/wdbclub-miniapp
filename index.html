<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>WDB Club</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="ds/fonts.css">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
  /* Каркас мини-аппа (#2): колонка шириной телефона, таб-бар прижат к низу,
     слой для шторок и тостов поверх. Цвета и формы — только из ДС. */
  html, body { margin: 0; background: var(--bg); }
  #app { max-width: 480px; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; }
  #app > .grow { flex: 1; }
  /* низ экрана (#14): закреплённая кнопка записи карточки мероприятия + таб-бар */
  #app > .dock { position: sticky; bottom: 0; z-index: 5; }
  #app > .dock > div { background: var(--bg); border-top: 1px solid var(--hair); padding: var(--sp-12) var(--sp-20); }
  #app > .dock > .tabbar { padding-bottom: calc(var(--sp-12) + env(safe-area-inset-bottom, 0px)); }
  #layer { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; pointer-events: none; z-index: 10; }
  #layer > * { pointer-events: auto; }
  #layer .sheet { padding-bottom: calc(var(--sp-24) + env(safe-area-inset-bottom, 0px)); }
  body.tg .appbar__back { display: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="layer" class="app" style="background:transparent"></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
